{% extends "base.html" %}

{% block title %}Add Student{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <h1
        class="text-3xl sm:text-4xl font-bold text-center bg-gradient-to-r from-blue-500 to-blue-700 bg-clip-text text-transparent mb-8">
        Add Student</h1>
    <form action="{{ url_for('add_student') }}" method="post"
        class="bg-white bg-opacity-95 rounded-xl shadow-lg p-6 sm:p-8 backdrop-blur-md">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
                <input type="text" name="name" id="name" placeholder="Enter Name" required
                    class="mt-1 w-full p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-blue-50">
            </div>
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
                <input type="text" name="username" id="username" placeholder="Enter Username" required
                    class="mt-1 w-full p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-blue-50">
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="text" name="email" id="email" placeholder="Enter Email" required
                    class="mt-1 w-full p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-blue-50">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" name="password" id="password" placeholder="Enter Password" required
                    class="mt-1 w-full p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-blue-50">
            </div>
            <div>
                <label for="age" class="block text-sm font-medium text-gray-700">Age</label>
                <input type="text" name="age" id="age" placeholder="Enter Age" required pattern="\d+"
                    class="mt-1 w-full p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-blue-50">
            </div>
            <div>
                <label for="dob" class="block text-sm font-medium text-gray-700">Date of Birth</label>
                <input type="date" name="dateOfBirth" id="dob" required
                    class="mt-1 w-full p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-blue-50">
            </div>
            <div>
                <label for="total_credits" class="block text-sm font-medium text-gray-700">Total Credits</label>
                <input type="text" name="total_credits" id="total_credits" placeholder="Enter Total Credits" required pattern="\d+"
                    class="mt-1 w-full p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-blue-50">
            </div>
            <div>
                <label for="class_id" class="block text-sm font-medium text-gray-700">Class</label>
                <select name="class_id" id="class_id" required
                    class="mt-1 w-full p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-blue-50">
                    <option value="" disabled selected>Select Class</option>
                    {% for class in classes %}
                    <option value="{{ class.id }}">{{ class.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="mt-6">
            <label class="block text-sm font-medium text-gray-700">Gender</label>
            <div class="flex gap-6 mt-2">
                <label class="flex items-center"><input type="radio" name="gender" value="male" required
                        class="mr-2 accent-blue-500"> Male</label>
                <label class="flex items-center"><input type="radio" name="gender" value="female"
                        class="mr-2 accent-blue-500">
                    Female</label>
                <label class="flex items-center"><input type="radio" name="gender" value="other"
                        class="mr-2 accent-blue-500">
                    Other</label>
            </div>
        </div>

        <div class="mt-6">
            <h3 class="text-lg font-semibold text-blue-600">Address</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-4">
                <input type="text" name="street" placeholder="Street" required
                    class="p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-blue-50">
                <input type="text" name="city" placeholder="City" required
                    class="p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-blue-50">
                <input type="text" name="region" placeholder="Region" required
                    class="p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-blue-50">
                <input type="text" name="postCode" placeholder="Post Code" required
                    class="p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-blue-50">
                <input type="text" name="country" placeholder="Country" required
                    class="p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-blue-50">
            </div>
        </div>

        <div class="mt-6">
            <h3 class="text-lg font-semibold text-blue-600">Parents</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mt-4">
                <input type="text" name="fatherName" placeholder="Father's Name" required
                    class="p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-blue-50">
                <input type="text" name="motherName" placeholder="Mother's Name" required
                    class="p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-blue-50">
                <input type="text" name="fatherNumber" placeholder="Father's Number" required pattern="\d{10,}"
                    class="p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-blue-50">
                <input type="text" name="motherNumber" placeholder="Mother's Number" required pattern="\d{10,}"
                    class="p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-50">
            </div>
        </div>

        <div class="mt-8 flex flex-col sm:flex-row justify-center gap-4">
            <input type="submit" value="Add Student"
                class="bg-gradient-to-r from-blue-500 to-blue-600 text-white px-6 py-3 rounded-lg hover:from-blue-600 hover:to-blue-700 transition-transform transform hover:scale-105 cursor-pointer">
            <a href="{{ url_for('index') }}"
                class="bg-gradient-to-r from-indigo-500 to-indigo-600 text-white px-6 py-3 rounded-lg hover:from-indigo-600 hover:to-indigo-700 transition-transform transform hover:scale-105 text-center">View
                Students</a>
        </div>
    </form>
</div>
{% endblock %}
