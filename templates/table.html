{% extends "base.html" %}

{% block title %}Students Information{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <h1
        class="text-3xl sm:text-4xl font-bold text-center bg-gradient-to-r from-blue-500 to-blue-700 bg-clip-text text-transparent mb-8">
        Students Information</h1>
    <div class="flex flex-col sm:flex-row gap-4 mb-6">
        <form action="{{ url_for('search_student') }}" method="POST" class="flex-1 flex gap-4">
            <input type="text" name="search_id" placeholder="Enter Student ID" required
                class="flex-1 p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-blue-50">
            <button type="submit"
                class="bg-gradient-to-r from-blue-500 to-blue-600 text-white px-6 py-3 rounded-lg hover:from-blue-600 hover:to-blue-700 transition-transform transform hover:scale-105">Search</button>
        </form>
        <a href="{{ url_for('add_student') }}"
            class="bg-gradient-to-r from-indigo-500 to-indigo-600 text-white px-6 py-3 rounded-lg hover:from-indigo-600 hover:to-indigo-700 transition-transform transform hover:scale-105 text-center">Add
            Student</a>
    </div>
    <div id="students-table" class="bg-white rounded-xl shadow-lg overflow-hidden"></div>
</div>

<script type="text/babel">
    function StudentsTable() {
        const [students, setStudents] = React.useState([
            {% for student in students %}
    {
        id: {{ student.id}},
        name: {{student.name | tojson}},
        age: {{student.age}},
        date_of_birth: {{student.date_of_birth | tojson}},
        gender: {{student.gender | tojson}},
        street: {{student.street | tojson}},
        city: {{student.city | tojson}},
        region: {{student.region | tojson}},
        post_code: {{student.post_code | tojson}},
        country: {{student.country | tojson}},
        father_name: {{student.father_name | tojson}},
        father_number: {{student.father_number | tojson}},
        mother_name: {{student.mother_name | tojson}},
        mother_number: {{student.mother_number | tojson}},
        class_name: {{student.class_.name | tojson}}
    } {% if not loop.last %}, {% endif %}
    {% endfor %}
        ]);
    const [sortConfig, setSortConfig] = React.useState({ key: null, direction: 'asc' });

    const sortTable = (key, isNumeric) => {
        const direction = sortConfig.key === key && sortConfig.direction === 'asc' ? 'desc' : 'asc';
        const sortedStudents = [...students].sort((a, b) => {
            let aValue = isNumeric ? parseFloat(a[key]) : a[key].toLowerCase();
            let bValue = isNumeric ? parseFloat(b[key]) : b[key].toLowerCase();
            if (aValue < bValue) return direction === 'asc' ? -1 : 1;
            if (aValue > bValue) return direction === 'asc' ? 1 : -1;
            return 0;
        });
        setStudents(sortedStudents);
        setSortConfig({ key, direction });
    };

    return (
        <div className="overflow-x-auto">
            <table className="min-w-full divide-y divide-blue-100">
                <thead className="bg-blue-50">
                    <tr>
                        {[
                            { key: 'id', label: 'ID', isNumeric: true },
                            { key: 'name', label: 'Name' },
                            { key: 'age', label: 'Age', isNumeric: true },
                            { key: 'date_of_birth', label: 'Date of Birth' },
                            { key: 'gender', label: 'Gender' },
                            { key: 'class_name', label: 'Class' },
                            { key: 'street', label: 'Street' },
                            { key: 'city', label: 'City' },
                            { key: 'region', label: 'Region' },
                            { key: 'post_code', label: 'Post Code' },
                            { key: 'country', label: 'Country' },
                            { key: 'father_name', label: "Father's Name" },
                            { key: 'father_number', label: "Father's Number" },
                            { key: 'mother_name', label: "Mother's Name" },
                            { key: 'mother_number', label: "Mother's Number" },
                            { key: null, label: 'Edit' },
                            { key: null, label: 'Delete' }
                        ].map((col, index) => (
                            <th key={index} onClick={() => col.key && sortTable(col.key, col.isNumeric)} className="px-4 py-3 text-left text-sm font-semibold text-gray-700 hover:bg-blue-100 cursor-pointer">
                                {col.label}
                                {sortConfig.key === col.key && (
                                    <span>{sortConfig.direction === 'asc' ? ' ↑' : ' ↓'}</span>
                                )}
                            </th>
                        ))}
                    </tr>
                </thead>
                <tbody className="divide-y divide-blue-100">
                    {students.map(student => (
                        <tr key={student.id} className="hover:bg-blue-50">
                            <td className="px-4 py-3 text-sm text-gray-700">{student.id}</td>
                            <td className="px-4 py-3 text-sm text-gray-700">{student.name}</td>
                            <td className="px-4 py-3 text-sm text-gray-700">{student.age}</td>
                            <td className="px-4 py-3 text-sm text-gray-700">{student.date_of_birth}</td>
                            <td className="px-4 py-3 text-sm text-gray-700">{student.gender}</td>
                            <td className="px-4 py-3 text-sm text-gray-700">{student.class_name}</td>
                            <td className="px-4 py-3 text-sm text-gray-700">{student.street}</td>
                            <td className="px-4 py-3 text-sm text-gray-700">{student.city}</td>
                            <td className="px-4 py-3 text-sm text-gray-700">{student.region}</td>
                            <td className="px-4 py-3 text-sm text-gray-700">{student.post_code}</td>
                            <td className="px-4 py-3 text-sm text-gray-700">{student.country}</td>
                            <td className="px-4 py-3 text-sm text-gray-700">{student.father_name}</td>
                            <td className="px-4 py-3 text-sm text-gray-700">{student.father_number}</td>
                            <td className="px-4 py-3 text-sm text-gray-700">{student.mother_name}</td>
                            <td className="px-4 py-3 text-sm text-gray-700">{student.mother_number}</td>
                            <td className="px-4 py-3">
                                <a href={`/edit/${student.id}`} className="bg-gradient-to-r from-green-500 to-green-600 text-white px-4 py-2 rounded-lg hover:from-green-600 hover:to-green-700 transition-transform transform hover:scale-105">Edit</a>
                            </td>
                            <td className="px-4 py-3">
                                <form action={`/delete/${student.id}`} method="POST" onSubmit={e => !confirm('Are you sure you want to delete this student?') && e.preventDefault()}>
                                    <button type="submit" className="bg-gradient-to-r from-red-500 to-red-600 text-white px-4 py-2 rounded-lg hover:from-red-600 hover:to-red-700 transition-transform transform hover:scale-105">Delete</button>
                                </form>
                            </td>
                        </tr>
                    ))}
                </tbody>
            </table>
        </div>
    );
    }

    ReactDOM.render(<StudentsTable />, document.getElementById('students-table'));
</script>
{% endblock %}
