{% extends "base.html" %}

{% block title %}Update Student{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <h1
        class="text-3xl sm:text-4xl font-bold text-center bg-gradient-to-r from-blue-500 to-blue-700 bg-clip-text text-transparent mb-8">
        Update Student Details</h1>
    <form action="{{ url_for('edit_student', id=datas.id) }}" method="post"
        class="bg-white bg-opacity-95 rounded-xl shadow-lg p-6 sm:p-8 backdrop-blur-md">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
                <input type="text" id="name" name="name" value="{{ datas.name }}" required
                    class="mt-1 w-full p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-blue-50">
            </div>
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700">Name</label>
                <input type="text" id="username" name="username" value="{{ datas.username }}" required
                    class="mt-1 w-full p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-blue-50">
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Name</label>
                <input type="text" id="email" name="email" value="{{ datas.email }}" required
                    class="mt-1 w-full p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-blue-50">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Name</label>
                <input type="text" id="password" name="password" value="{{ datas.password }}" required
                    class="mt-1 w-full p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-blue-50">
            </div>
            <div>
                <label for="age" class="block text-sm font-medium text-gray-700">Age</label>
                <input type="text" id="age" name="age" value="{{ datas.age }}" required pattern="\d+"
                    class="mt-1 w-full p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-blue-50">
            </div>
            <div>
                <label for="dob" class="block text-sm font-medium text-gray-700">Date of Birth</label>
                <input type="date" id="dob" name="dateOfBirth" value="{{ datas.date_of_birth }}" required
                    class="mt-1 w-full p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-blue-50">
            </div>
            <div>
                <label for="class_id" class="block text-sm font-medium text-gray-700">Class</label>
                <select name="class_id" id="class_id" required
                    class="mt-1 w-full p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-blue-50">
                    <option value="" disabled>Select Class</option>
                    {% for class in classes %}
                    <option value="{{ class.id }}" {% if class.id==datas.class_id %}selected{% endif %}>{{ class.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="mt-6">
            <label class="block text-sm font-medium text-gray-700">Gender</label>
            <div class="flex gap-6 mt-2">
                <label class="flex items-center"><input type="radio" name="gender" value="male" {% if
                        datas.gender=='male' %}checked{% endif %} required class="mr-2 accent-blue-500"> Male</label>
                <label class="flex items-center"><input type="radio" name="gender" value="female" {% if
                        datas.gender=='female' %}checked{% endif %} class="mr-2 accent-blue-500"> Female</label>
                <label class="flex items-center"><input type="radio" name="gender" value="other" {% if
                        datas.gender=='other' %}checked{% endif %} class="mr-2 accent-blue-500"> Other</label>
            </div>
        </div>

        <div class="mt-6">
            <h3 class="text-lg font-semibold text-blue-600">Address</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-4">
                <input type="text" id="street" name="street" value="{{ datas.street }}" required
                    class="p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-blue-50">
                <input type="text" id="city" name="city" value="{{ datas.city }}" required
                    class="p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-blue-50">
                <input type="text" id="region" name="region" value="{{ datas.region }}" required
                    class="p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-blue-50">
                <input type="text" id="postCode" name="postCode" value="{{ datas.post_code }}" required
                    class="p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-blue-50">
                <input type="text" id="country" name="country" value="{{ datas.country }}" required
                    class="p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-50">
            </div>
        </div>

        <div class="mt-6">
            <h3 class="text-lg font-semibold text-blue-600">Parents</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mt-4">
                <input type="text" id="fatherName" name="fatherName" value="{{ datas.father_name }}" required
                    class="p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-blue-50">
                <input type="text" id="motherName" name="motherName" value="{{ datas.mother_name }}" required
                    class="p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-blue-50">
                <input type="text" id="fatherNumber" name="fatherNumber" value="{{ datas.father_number }}" required
                    pattern="\d{10,}"
                    class="p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-blue-50">
                <input type="text" id="motherNumber" name="motherNumber" value="{{ datas.mother_number }}" required
                    pattern="\d{10,}"
                    class="p-3 border border-blue-100 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-50">
            </div>
        </div>

        <div class="mt-8 flex flex-col sm:flex-row justify-center gap-4">
            <input type="submit" value="Update Student"
                class="bg-gradient-to-r from-green-500 to-green-600 text-white px-6 py-3 rounded-lg hover:from-green-600 hover:to-green-700 transition-transform transform hover:scale-105 cursor-pointer">
            <a href="{{ url_for('index') }}"
                class="bg-gradient-to-r from-indigo-500 to-indigo-600 text-white px-6 py-3 rounded-lg hover:from-indigo-600 hover:to-indigo-700 transition-transform transform hover:scale-105 text-center">Back
                to List</a>
        </div>
    </form>
</div>
{% endblock %}
